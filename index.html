<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee ID Verification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #1f2937;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        input {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        button {
            width: 95%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Employee ID Verification</h1>

        <div class="subtitle">
            Enter Employee ID to verify
        </div>

        <input
            type="text"
            id="employeeId"
            placeholder="Enter Employee ID"
        >

        <button onclick="searchEmployee()">
            Verify Employee
        </button>

        <div id="result"></div>

    </div>

    <script>
        function searchEmployee() {
            const employeeId = document.getElementById("employeeId").value.trim();

            if (employeeId === "") {
                document.getElementById("result").innerHTML =
                    "<p>Please enter Employee ID.</p>";
                return;
            }

            document.getElementById("result").innerHTML =
                "<p>Searching...</p>";
        }
    </script>

</body>
</html>
