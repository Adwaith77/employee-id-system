<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee ID Verification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #1f2937;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        input {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 95%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Employee ID Verification</h1>

    <div class="subtitle">
        Enter Employee ID to verify
    </div>

    <input
        type="text"
        id="employeeId"
        placeholder="Enter Employee ID"
    >

    <button onclick="searchEmployee()">
        Verify Employee
    </button>

    <div id="result"></div>

</div>

<script>

const SUPABASE_URL = "https://czerhudgpojrgthgrojk.supabase.co";

const SUPABASE_KEY = "sb_publishable_eu-_L-1rcd5TBk2vnXBmTw_a9H4JO40";


async function searchEmployee() {

    const employeeId =
        document.getElementById("employeeId").value.trim();

    const result =
        document.getElementById("result");

    if (employeeId === "") {
        result.innerHTML =
            "<p>Please enter Employee ID.</p>";
        return;
    }

    result.innerHTML =
        "<p>Searching...</p>";

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/public_employee_cards?employee_id=eq." +
            encodeURIComponent(employeeId) +
            "&select=*",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        const data = await response.json();

        if (data.length === 0) {

            result.innerHTML =
                "<p style='color:red;'>Employee ID Not valid</p>";

            return;
        }

        const employee = data[0];

        result.innerHTML = `
            <h2>${employee.name || ""}</h2>
            <p><b>Employee ID:</b> ${employee.employee_id || ""}</p>
            <p><b>Designation:</b> ${employee.designation || ""}</p>
            <p><b>DOB:</b> ${employee.dob || ""}</p>
            <p><b>Age:</b> ${employee.age || ""}</p>
            <p><b>Contractor:</b> ${employee.contractor || ""}</p>
            <p><b>Blood Group:</b> ${employee.blood_group || ""}</p>
            <p><b>Date of Issue:</b> ${employee.date_of_issue || ""}</p>
            <p><b>Valid Upto:</b> ${employee.valid_upto || ""}</p>
        `;

    } catch (error) {

        result.innerHTML =
            "<p style='color:red;'>Unable to connect to server.</p>";

        console.error(error);
    }
}

</script>

</body>
</html>
